id: ms-exam-study-tracker
name: MS Exam Study Tracker
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
connectors:
  # Read-only connection to the SQL analytics endpoint of the ExamCatalog
  # lakehouse that the SyncExamStudyGuides notebook fills. The two IDs come
  # from rayfin/.env (never committed). See "Connect the app to your lakehouse"
  # in README.md.
  - name: catalog
    type: fabric-sqlanalytics
    config:
      workspaceId: ${CATALOG_WORKSPACE_ID}
      itemId: ${CATALOG_SQL_ENDPOINT_ID}
    auth:
      type: application
    operations:
      - name: read
